<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="c1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="c1_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="c1_accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="c1_growth" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="c1_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#c1_bg)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" />
  
  <!-- Subtle Center Aura -->
  <circle cx="256" cy="256" r="130" fill="#38BDF8" opacity="0.08" filter="url(#c1_glow)" />

  <!-- Logo Mark -->
  <g id="logo-mark" transform="translate(10, 0)">
    <!-- Vertical Spine (Base stability) -->
    <rect x="136" y="116" width="46" height="280" rx="23" fill="url(#c1_main)" />

    <!-- Top Loop (Meta AdSet Layer) -->
    <path d="M160 116 H268 C318 116 358 152 358 198 C358 244 318 278 268 278 H160" 
          fill="none" stroke="url(#c1_accent)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bottom Loop with Growth Projection (Scaled ROI) -->
    <path d="M160 278 H286 C342 278 384 314 384 362 C384 410 342 444 286 444 H180" 
          transform="translate(0, -48)"
          fill="none" stroke="url(#c1_growth)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

    <!-- AI Core Intersect Node (Smart Decision Point) -->
    <circle cx="159" cy="256" r="22" fill="#0F172A" stroke="url(#c1_accent)" stroke-width="8" />
    <circle cx="159" cy="256" r="8" fill="#38BDF8" />

    <!-- Growth Pulse Particle -->
    <circle cx="286" cy="348" r="12" fill="#FFFFFF" filter="url(#c1_glow)" />
  </g>
</svg>