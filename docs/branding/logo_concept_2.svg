<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="c2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="c2_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="c2_indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="c2_diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="c2_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#c2_bg)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" />

  <!-- 4 Precision Targeting Reticles -->
  <!-- Top-Left -->
  <path d="M140 190 V156 C140 147.163 147.163 140 156 140 H190" 
        fill="none" stroke="url(#c2_cyan)" stroke-width="24" stroke-linecap="round" />
  <!-- Top-Right -->
  <path d="M322 140 H356 C364.837 140 372 147.163 372 156 V190" 
        fill="none" stroke="url(#c2_cyan)" stroke-width="24" stroke-linecap="round" />
  <!-- Bottom-Right -->
  <path d="M372 322 V356 C372 364.837 364.837 372 356 372 H322" 
        fill="none" stroke="url(#c2_indigo)" stroke-width="24" stroke-linecap="round" />
  <!-- Bottom-Left -->
  <path d="M190 372 H156 C147.163 372 140 364.837 140 356 V322" 
        fill="none" stroke="url(#c2_indigo)" stroke-width="24" stroke-linecap="round" />

  <!-- Radar Scanning Orbit -->
  <circle cx="256" cy="256" r="92" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="12" />
  <circle cx="256" cy="256" r="92" fill="none" stroke="url(#c2_cyan)" stroke-width="12" stroke-dasharray="36 90" stroke-linecap="round" />

  <!-- Dynamic Center Diamond (Neural Core) -->
  <rect x="214" y="214" width="84" height="84" rx="20" 
        transform="rotate(45 256 256)" 
        fill="url(#c2_diamond)" />

  <!-- Center Core Eye -->
  <circle cx="256" cy="256" r="16" fill="#0B111E" />
  <circle cx="256" cy="256" r="8" fill="#38BDF8" />

  <!-- Crosshair Micro-Dots -->
  <circle cx="256" cy="140" r="7" fill="#38BDF8" filter="url(#c2_glow)" />
  <circle cx="372" cy="256" r="7" fill="#38BDF8" filter="url(#c2_glow)" />
  <circle cx="256" cy="372" r="7" fill="#6366F1" filter="url(#c2_glow)" />
  <circle cx="140" cy="256" r="7" fill="#38BDF8" filter="url(#c2_glow)" />
</svg>