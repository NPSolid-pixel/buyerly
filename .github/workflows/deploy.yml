name: CI/CD & Auto-Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buyerly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buyerly
          POSTGRES_PASSWORD: buyerly_secret
          POSTGRES_DB: buyerly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Frontend JavaScript Syntax
        run: |
          find webapp/js -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://buyerly:buyerly_secret@localhost:5432/buyerly_test
          TEST_DATABASE_URL: postgresql+asyncpg://buyerly:buyerly_secret@localhost:5432/buyerly_test
          REDIS_URL: redis://localhost:6379/15
          TRUSTED_PROXY_CIDRS: 127.0.0.1/32
        run: |
          set -o pipefail
          python -m unittest discover tests -v 2>&1 | tee /tmp/buyerly-test-output.log || {
            failure_excerpt=$(grep -E -B 12 -A 35 '^(FAIL|ERROR):|Traceback|AssertionError|^FAILED|^Ran [0-9]+' /tmp/buyerly-test-output.log | tail -n 180 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Unit test failure::${failure_excerpt}"
            exit 1
          }

  deploy:
    name: Deploy to Production VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Execute Remote SSH Commands for Deployment
        id: production_ssh
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE || '' }}
          password: ${{ secrets.VPS_PASSWORD || '' }}
          port: ${{ secrets.VPS_PORT || 22 }}
          capture_stdout: true
          script: |
            set -e
            echo "🚀 [Deploy] Connected to VPS. Starting deployment for Buyerly..."
            if [ -d "/opt/buyerly" ]; then
              cd /opt/buyerly
              echo "📥 Pulling latest git changes..."
              git fetch origin main
              git reset --hard origin/main
              chmod +x scripts/deploy.sh scripts/backup_db.sh || true
              deploy_log="/tmp/buyerly-deploy-${{ github.sha }}.log"
              umask 077
              : >"${deploy_log}"
              if EXPECTED_SHA="${{ github.sha }}" RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" bash scripts/deploy.sh >"${deploy_log}" 2>&1; then
                echo "BUYERLY_DEPLOY_RESULT=success"
                rm -f "${deploy_log}"
              else
                deploy_status=$?
                echo "BUYERLY_DEPLOY_RESULT=failure"
                echo "BUYERLY_DEPLOY_EXIT=${deploy_status}"
                grep -E '^\[([1-6]/6|ERROR|ROLLBACK)\]' "${deploy_log}" \
                  | tail -n 20 \
                  | sed -E 's/(re_)[A-Za-z0-9_]{6,}/\1[REDACTED]/g' \
                  || true
                grep -E '(MetaTokenError|RuntimeError|alembic\.util\.exc\.|sqlalchemy\.exc\.|ProgrammingError|OperationalError|IntegrityError|InvalidToken|ValueError|KeyError|FAILED:)' "${deploy_log}" \
                  | grep -Ev '(parameters:|UPDATE accounts|INSERT INTO)' \
                  | tail -n 12 \
                  | sed -E \
                    -e 's/gAAAAA[A-Za-z0-9_-]+/[REDACTED_FERNET_TOKEN]/g' \
                    -e 's/EAA[A-Za-z0-9_-]{10,}/[REDACTED_META_TOKEN]/g' \
                    -e 's#(://)[^:/[:space:]]+:[^@/[:space:]]+@#\1[REDACTED]@#g' \
                    -e 's/(password=)[^&[:space:]]+/\1[REDACTED]/Ig' \
                  || true
              fi
            else
              echo "❌ Error: /opt/buyerly directory does not exist on server!"
              echo "BUYERLY_DEPLOY_RESULT=failure"
              echo "[ERROR] Production application directory is missing."
            fi
            exit 0

      - name: Assert Remote Deployment Result
        env:
          DEPLOY_OUTPUT: ${{ steps.production_ssh.outputs.stdout }}
        run: |
          if printf '%s\n' "${DEPLOY_OUTPUT}" | grep -q '^BUYERLY_DEPLOY_RESULT=success$'; then
            exit 0
          fi
          diagnostic=$(printf '%s\n' "${DEPLOY_OUTPUT}" \
            | grep -E '(^(BUYERLY_DEPLOY_EXIT=|\[([1-6]/6|ERROR|ROLLBACK)\])|MetaTokenError|RuntimeError|alembic\.util\.exc\.|sqlalchemy\.exc\.|ProgrammingError|OperationalError|IntegrityError|InvalidToken|ValueError|KeyError|FAILED:)' \
            | tail -n 32 \
            | tr '\n' ' ')
          diagnostic=${diagnostic//%/%25}
          diagnostic=${diagnostic//$'\r'/%0D}
          diagnostic=${diagnostic//$'\n'/%0A}
          echo "::error title=Production deploy failure::${diagnostic:-Remote deploy did not return a success marker.}"
          exit 1
