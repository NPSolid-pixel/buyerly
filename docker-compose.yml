x-app: &app
  build: .
  image: buyerly-app:${APP_VERSION:-local}
  env_file:
    - .env
  environment: &app-environment
    APP_VERSION: ${APP_VERSION:-local}
    DATABASE_URL: postgresql+asyncpg://buyerly:${POSTGRES_PASSWORD:-buyerly-local-change-me}@db:5432/buyerly
    WEBAPP_URL: ${WEBAPP_URL:-https://smattrades.com}
    TZ: UTC
  volumes:
    - ./logs:/app/logs
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    container_name: buyerly-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: buyerly
      POSTGRES_USER: buyerly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buyerly-local-change-me}
      TZ: UTC
    volumes:
      - buyerly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyerly -d buyerly"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    <<: *app
    container_name: buyerly-migrate
    command: ["python", "-m", "services.database"]
    restart: "no"
    environment:
      <<: *app-environment
      LEGACY_SQLITE_PATH: /legacy/mediabuyer.db
    volumes:
      - ./data:/legacy:ro
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    container_name: buyerly-api
    command: ["python", "-m", "services.api"]
    environment:
      <<: *app-environment
      SERVE_STATIC: "false"
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  web:
    build: ./webapp
    image: buyerly-web:${APP_VERSION:-local}
    container_name: buyerly-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  bot:
    <<: *app
    container_name: buyerly-telegram-bot
    command: ["python", "-m", "services.bot"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/buyerly-bot-ready').is_file()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  worker:
    <<: *app
    container_name: buyerly-worker
    command: ["python", "-m", "services.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/buyerly-worker-ready').is_file()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  # Compatibility bridge for the first deployment from the former monolith.
  # It is only started explicitly by the old deploy script and never by default.
  buyerly:
    profiles: ["legacy"]
    build: .
    image: buyerly-app:${APP_VERSION:-local}
    container_name: buyerly-bot
    command: ["python", "main.py"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    environment:
      APP_VERSION: ${APP_VERSION:-local}
      DATABASE_URL: sqlite+aiosqlite:////app/data/mediabuyer.db
      WEBAPP_URL: ${WEBAPP_URL:-https://smattrades.com}
      TZ: UTC
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  buyerly-postgres:
    name: buyerly-postgres
