services:
  buyerly:
    build: .
    container_name: buyerly-bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/mediabuyer.db
      - TZ=UTC

