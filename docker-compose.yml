x-app: &app
  build: .
  image: buyerly-app:${APP_VERSION:-local}
  env_file:
    - .env
  environment: &app-environment
    APP_VERSION: ${APP_VERSION:-local}
    DATABASE_URL: postgresql+asyncpg://buyerly:${POSTGRES_PASSWORD:-buyerly-local-change-me}@db:5432/buyerly
    REDIS_URL: redis://redis:6379/0
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    WEBAPP_URL: ${WEBAPP_URL:-https://buyerly.app}
    TZ: UTC
  volumes:
    - ./logs:/app/logs
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    container_name: buyerly-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: buyerly
      POSTGRES_USER: buyerly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buyerly-local-change-me}
      TZ: UTC
    volumes:
      - buyerly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyerly -d buyerly"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: buyerly-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - buyerly-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    <<: *app
    container_name: buyerly-migrate
    command: ["python", "-m", "services.database"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    container_name: buyerly-api
    command: ["python", "-m", "services.api"]
    environment:
      <<: *app-environment
      SERVE_STATIC: "false"
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  web:
    build: ./webapp
    image: buyerly-web:${APP_VERSION:-local}
    container_name: buyerly-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  bot:
    <<: *app
    container_name: buyerly-telegram-bot
    command: ["python", "-m", "services.bot"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/buyerly-bot-ready').is_file()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  worker:
    <<: *app
    container_name: buyerly-worker
    command: ["python", "-m", "services.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import time, sys; from pathlib import Path; p = Path('/tmp/buyerly-worker-heartbeat'); sys.exit(0 if p.is_file() and (time.time() - p.stat().st_mtime) < 45 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 15s

volumes:
  buyerly-postgres:
    name: buyerly-postgres
  buyerly-redis:
    name: buyerly-redis
