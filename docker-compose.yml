services:
  buyerly:
    build: .
    image: buyerly-app:${APP_VERSION:-local}
    container_name: buyerly-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    environment:
      - APP_VERSION=${APP_VERSION:-local}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/mediabuyer.db
      - TZ=UTC
